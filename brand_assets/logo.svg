<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 116" width="380" height="116">
  <defs>
    <style>
      .lm-wood { font-family: Georgia, serif; font-weight: 700; font-size: 48px; fill: #8B5230; letter-spacing: -1px; }
      .lm-land { font-family: Georgia, serif; font-weight: 700; font-size: 48px; fill: #2D6A1F; letter-spacing: -1px; }
      .lm-sub  { font-family: Georgia, serif; font-weight: 700; font-size: 28px; fill: #2D6A1F; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- WOOD -->
  <text x="170" y="54" text-anchor="end" class="lm-wood">WOOD</text>

  <!-- Pine tree -->
  <g transform="translate(178, 20)">
    <polygon points="12,0  3,11  21,11" fill="#2D6A1F"/>
    <polygon points="12,6  0,20  24,20" fill="#2D6A1F"/>
    <polygon points="12,13 -4,32 28,32" fill="#2D6A1F"/>
    <rect x="9" y="32" width="6" height="4" fill="#3D2010"/>
  </g>

  <!-- LAND -->
  <text x="210" y="54" text-anchor="start" class="lm-land">LAND</text>

  <!-- FENCE AND DECK -->
  <text x="190" y="95" text-anchor="middle" class="lm-sub">FENCE AND DECK</text>
</svg>
