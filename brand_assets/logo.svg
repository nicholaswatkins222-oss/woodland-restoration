<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="380" height="96">
  <defs>
    <style>
      .lm { font-family: Georgia, serif; font-weight: 700; font-size: 48px; fill: #1F3D12; }
      .ls { font-family: Georgia, serif; font-weight: 700; font-size: 13px; fill: #7B4F2A; letter-spacing: 2px; }
      .lt { font-family: Georgia, serif; font-weight: 600; font-size: 9.5px; fill: #1F3D12; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- WOOD — right-edge anchored 8px left of tree -->
  <text x="166" y="54" text-anchor="end" class="lm">WOOD</text>

  <!-- Pine tree — visual center at x=190 (translate 178 because tree shape centers at +12) -->
  <g transform="translate(178, 3)">
    <polygon points="12,0  2,16  22,16" fill="#2D6A1F"/>
    <polygon points="12,9  -1,26 25,26" fill="#2D6A1F"/>
    <polygon points="12,20 -4,42 28,42" fill="#2D6A1F"/>
    <rect x="8" y="42" width="8" height="9" fill="#3D2010"/>
  </g>

  <!-- LAND — left-edge anchored 8px right of tree -->
  <text x="214" y="54" text-anchor="start" class="lm">LAND</text>

  <!-- FENCE & DECK row: lines stop well before text, same vertical center as text -->
  <!-- Text at 13px, baseline y=70 → cap center ≈ y=65 → lines at y=65 -->
  <line x1="6"   y1="65" x2="114" y2="65" stroke="#7B4F2A" stroke-width="1.3"/>
  <text x="190" y="70" text-anchor="middle" class="ls">FENCE &amp; DECK</text>
  <line x1="266" y1="65" x2="374" y2="65" stroke="#7B4F2A" stroke-width="1.3"/>

  <!-- GENERAL CONSTRUCTION -->
  <text x="190" y="84" text-anchor="middle" class="lt">GENERAL CONSTRUCTION</text>
</svg>
