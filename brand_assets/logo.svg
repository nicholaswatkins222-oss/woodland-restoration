<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 108" width="340" height="108">
  <defs>
    <style>
      .lm { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 700; font-size: 46px; fill: #1A3510; letter-spacing: 0px; }
      .ls { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 700; font-size: 14px; fill: #1A3510; letter-spacing: 3px; }
      .lt { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 600; font-size: 10px; fill: #1A3510; letter-spacing: 4px; }
      .le { font-family: 'Georgia', 'Times New Roman', serif; font-size: 8.5px; fill: #1A3510; letter-spacing: 2.5px; }
      .ll { stroke: #7A5C3E; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- WOOD -->
  <text x="19" y="52" class="lm">WOOD</text>

  <!-- Pine tree icon — three tiers + trunk, centered between WOOD and LAND -->
  <g transform="translate(165, 5)">
    <polygon points="12,0  1,17  23,17" fill="#2D6A1F"/>
    <polygon points="12,9  -1,27 25,27" fill="#2D6A1F"/>
    <polygon points="12,20 -4,41 28,41" fill="#2D6A1F"/>
    <rect x="8" y="41" width="8" height="9" fill="#4A2E10"/>
  </g>

  <!-- LAND -->
  <text x="201" y="52" class="lm">LAND</text>

  <!-- ——— FENCE & DECK ——— -->
  <line x1="10"  y1="65" x2="113" y2="65" class="ll"/>
  <text x="170" y="70" text-anchor="middle" class="ls">FENCE &amp; DECK</text>
  <line x1="227" y1="65" x2="330" y2="65" class="ll"/>

  <!-- GENERAL CONSTRUCTION -->
  <text x="170" y="85" text-anchor="middle" class="lt">GENERAL CONSTRUCTION</text>

  <!-- ESTABLISHED 2015 -->
  <text x="170" y="99" text-anchor="middle" class="le">ESTABLISHED 2015</text>
</svg>
