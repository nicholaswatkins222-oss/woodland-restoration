<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <style>
      .logo-wood { font-family: 'Georgia', serif; font-weight: 700; font-size: 38px; fill: #7A5230; letter-spacing: -1px; }
      .logo-land { font-family: 'Georgia', serif; font-weight: 700; font-size: 38px; fill: #4A2E12; letter-spacing: -1px; }
      .logo-restoration { font-family: 'Georgia', serif; font-weight: 600; font-size: 13px; fill: #2D6A1F; letter-spacing: 4px; }
      .logo-line { stroke: #2D6A1F; stroke-width: 1.5; }
    </style>
  </defs>
  <!-- WOOD text -->
  <text x="12" y="46" class="logo-wood">WOOD</text>
  <!-- Tree icon (pine) between WOOD and LAND -->
  <g transform="translate(148, 6)">
    <!-- Tree layers -->
    <polygon points="12,2 0,18 24,18" fill="#2D6A1F"/>
    <polygon points="12,10 -2,28 26,28" fill="#2D6A1F"/>
    <polygon points="12,20 -4,38 28,38" fill="#2D6A1F"/>
    <!-- Trunk -->
    <rect x="9" y="38" width="6" height="8" fill="#4A2E12"/>
  </g>
  <!-- LAND text -->
  <text x="172" y="46" class="logo-land">LAND</text>
  <!-- Divider lines and RESTORATION -->
  <line x1="12" y1="56" x2="65" y2="56" class="logo-line"/>
  <text x="72" y="63" class="logo-restoration">RESTORATION</text>
  <line x1="255" y1="56" x2="308" y2="56" class="logo-line"/>
</svg>
