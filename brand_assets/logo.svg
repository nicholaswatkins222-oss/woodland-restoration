<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 104" width="320" height="104">
  <defs>
    <style>
      .logo-main { font-family: 'Georgia', serif; font-weight: 700; font-size: 40px; fill: #1F3D12; letter-spacing: -1px; }
      .logo-sub  { font-family: 'Georgia', serif; font-weight: 700; font-size: 13px; fill: #1F3D12; letter-spacing: 2px; }
      .logo-tag  { font-family: 'Georgia', serif; font-weight: 600; font-size: 9.5px; fill: #1F3D12; letter-spacing: 3.5px; }
      .logo-est  { font-family: 'Georgia', serif; font-size: 8px; fill: #1F3D12; letter-spacing: 2px; }
      .logo-line { stroke: #1F3D12; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- WOOD -->
  <text x="12" y="48" class="logo-main">WOOD</text>

  <!-- Pine tree icon between WOOD and LAND -->
  <g transform="translate(150, 8)">
    <polygon points="12,2 0,18 24,18" fill="#2D6A1F"/>
    <polygon points="12,10 -2,28 26,28" fill="#2D6A1F"/>
    <polygon points="12,20 -4,38 28,38" fill="#2D6A1F"/>
    <rect x="9" y="38" width="6" height="8" fill="#3D2010"/>
  </g>

  <!-- LAND -->
  <text x="178" y="48" class="logo-main">LAND</text>

  <!-- ——— FENCE & DECK ——— -->
  <line x1="12" y1="62" x2="96" y2="62" class="logo-line"/>
  <text x="160" y="67" text-anchor="middle" class="logo-sub">FENCE &amp; DECK</text>
  <line x1="224" y1="62" x2="308" y2="62" class="logo-line"/>

  <!-- GENERAL CONSTRUCTION -->
  <text x="160" y="81" text-anchor="middle" class="logo-tag">GENERAL CONSTRUCTION</text>

  <!-- ESTABLISHED 2015 -->
  <text x="160" y="95" text-anchor="middle" class="logo-est">ESTABLISHED 2015</text>
</svg>
